<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <h1>form pemesanan pizza</h1>
    <p>
       silakan isi form pemesanan ini dengan lengkap dan benar. 
    </p>

    <form action="hasil.html" method="get">
        <fieldset>
            <legend>Informasi Pemesan</legend>
            <p>
                <label for="costomername">Nama:</label>
                <input type="text" id="costomername" name="costomername" required>
            </p>
            
            <p>
                <label for="address">address:</label>
                <input type="text" id="address" name="address" required>
            </p>
            
            <p>
                <label for="telephone">telephone:</label>
                <input type="text" id="telephone" name="telephone" required>
            </p>
            
            <p>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </p>
            
            <p>
                <label for="intruction">delivery instruction:</label><br>
                <textarea
                    id="intruction" 
                    name="intruction" 
                    rows="4" 
                    cols="50"
                    maxlength="400"
                    placeholder="no more than 400 characters"></textarea>
            </p>
        </fieldset>

        <fieldset>
            <legend>design your dream pizza</legend>
            <p><strong>pizza specs</strong></p>
            <p>pilih salah satu</p>

            <p>
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label><br>
                
                <input type="radio" id="peperoni" name="crust" value="peperoni" required>
                <label for="peperoni">peperoni</label><br>
                
                <input type="radio" id="ayam" name="crust" value="ayam" required>
                <label for="ayam">ayam</label><br>
                
                <input type="radio" id="classic" name="crust" value="classic white" required>
                <label for="classic">classic white</label>
            </p>

            <p><strong>topping</strong></p>

            <p>
                <input type="checkbox" id="classic" name="toppings" value="classic white" >
                <label for="classic">red sauce</label><br>
                
                <input type="checkbox" id="peperoni" name="toppings" value="peperoni" >
                <label for="peperoni">white sauce</label><br>
                
                <input type="checkbox" id="ayam" name="toppings" value="ayam" >
                <label for="ayam">mozzarella chesse</label><br>
                
                <input type="checkbox" id="classic" name="toppings" value="classic white">
                <label for="classic">pepperoni</label>
            </p>
            
            <p>
                <label for="quantity">quantity:</label>
                <select id="quantity" name="quantity" required>
                    <option value="">--pilih jumlah--</option>
                    <option value="1">1</option>
                    <option value="2">2</option>
                    <option value="3">3</option>
                    <option value="4">4</option>
                    <option value="5">5</option>
                </select>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="submit">
            <input type="reset" value="reset">
        </p>
    </form>
</body>
</html>
